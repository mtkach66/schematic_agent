# Декларативные шаблоны УГО и синонимы меток цепей (M1, M2).
#
# Шаблоны дополняют встроенные детекторы components.SYMBOL_TEMPLATES.
# Каждый шаблон — простая геометрическая эвристика по прямоугольнику:
#   kind        — тип примитива (сейчас только rect);
#   min_aspect  — минимальное отношение long / short;
#   max_aspect  — максимальное отношение long / short;
#   min_short   — минимальная длина короткой стороны, pt;
#   max_short   — максимальная длина короткой стороны, pt;
#   min_long    — минимальная длина длинной стороны, pt;
#   max_long    — максимальная длина длинной стороны, pt.
#
# Кандидат принимается только при наличии рядом (в радиусе
# ref_attach_pt) позиционного обозначения с префиксом из ref_prefixes:
# так декларативные шаблоны не перехватывают прямоугольники у встроенных
# детекторов (резистор, предохранитель и т.п.).
#
# Уверенность намеренно консервативна: 0.4–0.6.

# M6: маппинг «ГОСТ ref-префикс проекта → УГО EPLAN».
# Name-ключи rich-библиотеки (SL, S, SSV…) не совпадают с префиксами
# позиционных обозначений промышленных проектов (QF, KM, XT…), поэтому
# точное совпадение срабатывает редко. Таблица включает второй шаг:
#   QF: breaker          — категория: все записи с heuristic == breaker;
#   KM: [SCHB, SCHL]     — список имён УГО (приоритет выше категории).
# Точное совпадение имени с префиксом (S1 → S) всегда проверяется первым.
# Таблица расширяется внешним файлом SCHEMATIC_AGENT_SYMBOLS_FILE.
ref_prefix_map:
  QF: breaker
  F: fuse
  FA: fuse
  FU: fuse
  M: motor
  H: lamp
  HL: lamp
  X: terminal
  XT: terminal
  K: switch
  KA: switch
  KM: switch
  KT: switch
  KB: switch
  S: switch
  SB: switch
  SA: switch
  SQ: switch

symbols:
  - name: contactor
    category: contactor
    ref_prefixes: [KM]
    confidence: 0.55
    geometry:
      kind: rect
      min_aspect: 1.5
      max_aspect: 4.0
      min_short: 12.0
      max_short: 70.0
      min_long: 20.0
      max_long: 160.0

  - name: breaker
    category: breaker
    ref_prefixes: [QF]
    confidence: 0.5
    geometry:
      kind: rect
      min_aspect: 1.2
      max_aspect: 5.0
      min_short: 8.0
      max_short: 45.0
      min_long: 12.0
      max_long: 140.0

  - name: transformer
    category: transformer
    ref_prefixes: [T]
    confidence: 0.45
    geometry:
      kind: rect
      min_aspect: 0.6
      max_aspect: 1.8
      min_short: 15.0
      max_short: 80.0
      min_long: 15.0
      max_long: 100.0

  - name: vfd
    category: vfd
    ref_prefixes: [UZ]
    confidence: 0.4
    geometry:
      kind: rect
      min_aspect: 1.2
      max_aspect: 3.5
      min_short: 25.0
      max_short: 90.0
      min_long: 30.0
      max_long: 220.0

  - name: terminal_block
    category: terminal_block
    ref_prefixes: [XT]
    confidence: 0.5
    geometry:
      kind: rect
      min_aspect: 2.0
      max_aspect: 12.0
      min_short: 3.0
      max_short: 20.0
      min_long: 8.0
      max_long: 200.0

# Синонимы меток цепей. Первый элемент группы — каноническое имя.
# DEFAULT-набор консервативен (общепромышленные пары). Соответствия
# L1↔U, L2↔V, L3↔W зависят от стандарта (ГОСТ/IEC) и по умолчанию
# отключены; включите их во внешнем файле через SCHEMATIC_AGENT_SYMBOLS_FILE.
net_aliases:
  - [N, NUL]
  - [PE, PEN]
