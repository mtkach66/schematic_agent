[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schematic-agent"
version = "0.1.0"
description = "Extract structured engineering data from electrical schematic PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "networkx>=3",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
schematic-agent = "schematic_agent.cli:main"

[tool.setuptools.packages.find]
include = ["schematic_agent*"]

[tool.setuptools.package-data]
schematic_agent = ["symbols.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "acceptance: интеграционные приёмочные тесты на эталонных PDF (Т1–Т12)",
]
